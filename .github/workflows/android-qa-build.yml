name: PadnaKesht Android QA Candidate
on:
  workflow_dispatch:
  push:
    branches: [kimi-android]
    paths:
      - 'index.html'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.js'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/android-qa-build.yml'
permissions:
  contents: read
concurrency:
  group: padnakasht-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-qa-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: kimi-android
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Keep Capacitor 6 compatible with patched tar
        run: node scripts/patch-capacitor-cli-tar.mjs
      - name: Run automated tests
        run: npm test
      - name: Build offline web assets
        run: npm run build
      - name: Verify offline bundle
        run: test -s dist/index.html
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Prepare Capacitor Android
        run: |
          # Never reuse a stale Flutter/native Android project for this Capacitor app.
          if [ ! -f android/gradlew ] || grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle 2>/dev/null; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          test -s android/app/src/main/assets/public/index.html
      - name: Assemble QA candidate APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify and checksum QA candidate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload QA candidate only (not production-approved)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-QA-Candidate-not-production-approved
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enable and verify KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Install and launch QA APK in Android emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-emulator-smoke.sh
