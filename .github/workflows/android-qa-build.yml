name: PadnaKesht Android QA Candidate
on:
  workflow_dispatch:
  push:
    branches: [kimi-android]
    paths:
      - 'index.html'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.js'
      - 'tests/**'
      - '.github/workflows/android-qa-build.yml'
permissions:
  contents: read
concurrency:
  group: padnakasht-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-qa-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: kimi-android
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build offline web assets
        run: npm run build
      - name: Verify offline bundle
        run: test -s dist/index.html
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Prepare Capacitor Android
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          test -s android/app/src/main/assets/public/index.html
      - name: Assemble QA candidate APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify and checksum QA candidate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload QA candidate only (not production-approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-QA-Candidate-not-production-approved
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Install and launch QA APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.padnakasht.kimi/.MainActivity
            sleep 10
            adb shell pidof com.padnakasht.kimi
            adb shell run-as com.padnakasht.kimi ls databases | grep -q 'padnakashtSQLite.db'
            # Prove the installed app survives a restart with network connectivity disabled.
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true || true
            adb shell am force-stop com.padnakasht.kimi
            adb shell am start -n com.padnakasht.kimi/.MainActivity
            sleep 5
            adb shell pidof com.padnakasht.kimi
            adb logcat -d > android-emulator-log.txt
            if grep -E 'FATAL EXCEPTION|SQLite initialization failed|No such plugin|Uncaught (ReferenceError|TypeError|SyntaxError)|Uncaught Error' android-emulator-log.txt; then
              exit 1
            fi
