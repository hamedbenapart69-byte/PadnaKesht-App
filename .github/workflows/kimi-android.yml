name: Kimi Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - kimi-android
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tests/**'
      - '.github/workflows/kimi-android.yml'

permissions:
  contents: read

concurrency:
  group: kimi-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dedicated Android branch
        uses: actions/checkout@v4
        with:
          ref: kimi-android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run offline source smoke tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Verify bundled offline entry point
        run: test -s dist/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          test -s android/app/src/main/assets/public/index.html

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists and is non-empty
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-Kimi-Offline-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
