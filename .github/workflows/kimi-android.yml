name: Build Kimi-based PadnaKesht Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - kimi-android
    paths:
      - 'Kimi_Agent_技能插件列表.zip'
      - '.github/workflows/kimi-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kimi Android branch
        uses: actions/checkout@v4

      - name: Require original Kimi source archive
        run: |
          test -f Kimi_Agent_技能插件列表.zip || {
            echo "::error::Upload the original Kimi_Agent_技能插件列表.zip to the repository root on branch kimi-android."
            exit 1
          }

      - name: Extract original Kimi project
        run: |
          mkdir -p kimi-source
          unzip -q Kimi_Agent_技能插件列表.zip -d kimi-source
          test -f kimi-source/app/package.json
          test -f kimi-source/app/index.html
          cd kimi-source/app
          node -e "const p=require('./package.json'); console.log('Source project:',p.name || 'Kimi project')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kimi-source/app/package-lock.json

      - name: Install web dependencies
        working-directory: kimi-source/app
        run: npm ci

      - name: Build web frontend
        working-directory: kimi-source/app
        run: npx vite build

      - name: Prepare Capacitor Android wrapper
        working-directory: kimi-source/app
        run: |
          npm install @capacitor/core@^6 @capacitor/android@^6
          npm install --save-dev @capacitor/cli@^6
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.padnakesht.kimi',
            appName: 'پادناکشت',
            webDir: 'dist',
            bundledWebRuntime: false
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: kimi-source/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-Kimi-Android-APK
          path: kimi-source/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
