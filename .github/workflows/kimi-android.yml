name: Build Kimi-based PadnaKesht Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - kimi-android
    paths:
      - 'Kimi_Agent_技能插件列表.zip'
      - 'kimi-source.zip'
      - '.github/workflows/kimi-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kimi Android branch
        uses: actions/checkout@v4
        with:
          ref: kimi-android

      - name: Require original Kimi source archive
        run: |
          if [ -f kimi-source.zip ]; then
            ARCHIVE=kimi-source.zip
          elif [ -f Kimi_Agent_技能插件列表.zip ]; then
            ARCHIVE=Kimi_Agent_技能插件列表.zip
          else
            echo "::error::The original Kimi ZIP is not committed on branch kimi-android. The build cannot proceed until the archive is uploaded."
            exit 1
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Validate and extract Kimi project
        run: |
          unzip -t "$ARCHIVE"
          mkdir -p kimi-source
          unzip -q "$ARCHIVE" -d kimi-source
          test -f kimi-source/app/package.json
          test -f kimi-source/app/package-lock.json
          test -f kimi-source/app/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kimi-source/app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install source dependencies
        working-directory: kimi-source/app
        run: npm ci

      - name: TypeScript check
        working-directory: kimi-source/app
        run: npm run check

      - name: Unit tests
        working-directory: kimi-source/app
        run: npm test -- --passWithNoTests

      - name: Add Capacitor Android support
        working-directory: kimi-source/app
        run: |
          npm install @capacitor/core@^6 @capacitor/android@^6
          npm install --save-dev @capacitor/cli@^6
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.padnakesht.kimi',
            appName: 'پادناکشت کیمی',
            webDir: 'dist/public',
            bundledWebRuntime: false
          };
          export default config;
          EOF

      - name: Build web app
        working-directory: kimi-source/app
        run: npm run build

      - name: Create and sync Android project
        working-directory: kimi-source/app
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          test -d dist/public

      - name: Build debug APK
        working-directory: kimi-source/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Android-debug-APK
          path: kimi-source/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
