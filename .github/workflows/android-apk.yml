name: Kimi Offline Android Release Gate
on:
  push:
    branches: [kimi-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kimi-android
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Keep Capacitor 6 compatible with patched tar
        run: node scripts/patch-capacitor-cli-tar.mjs
      - name: Audit installed dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const r=require('./npm-audit.json'); console.log('Dependency audit totals:', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name,item] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via.map(v=>typeof v==='string'?v:{title:v.title,url:v.url,range:v.range})}));"
      - name: Run unit and source tests
        run: npm test
      - name: Build web assets for engineering validation
        run: npm run build
      - name: Verify bundled offline entry point
        run: test -s dist/index.html
      - name: Evaluate release acceptance gate
        id: release_gate
        shell: bash
        run: |
          if npm run release:gate; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "## Release gate: APPROVED" >> "$GITHUB_STEP_SUMMARY"
            echo "Acceptance matrix and required sign-offs passed; the installable APK build may proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "## Release gate: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "No production APK was built or uploaded. Acceptance evidence is incomplete. Use the separate QA Candidate workflow only for internal testing." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Release blocked::Acceptance evidence is incomplete; no production APK will be published."
          fi
      - name: Set up Java
        if: steps.release_gate.outputs.approved == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: steps.release_gate.outputs.approved == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Prepare Android project
        if: steps.release_gate.outputs.approved == 'true'
        run: |
          # Never reuse a stale Flutter/native Android project for this Capacitor app.
          if [ ! -f android/gradlew ] || grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle 2>/dev/null; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          test -s android/app/src/main/assets/public/index.html
      - name: Build debug APK
        if: steps.release_gate.outputs.approved == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify and checksum APK
        if: steps.release_gate.outputs.approved == 'true'
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload installable APK and checksum
        if: steps.release_gate.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-Kimi-Offline-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
