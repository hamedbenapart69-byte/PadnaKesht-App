name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Generate Flutter project files
        run: |
          rm -rf android windows
          flutter create --platforms=android,windows --project-name padnakesht --org com.padnakesht .
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:padnakesht/main.dart';

          void main() {
            testWidgets('PadnaKesht launches', (tester) async {
              await tester.pumpWidget(const PadnaKeshtApp());
              expect(find.text('PadnaKesht'), findsWidgets);
            });
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
