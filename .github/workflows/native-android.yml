name: PadnaKesht Native Compose Migration
on:
  workflow_dispatch:
  push:
    branches: [kimi-android]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
permissions:
  contents: read
concurrency:
  group: padnakasht-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run native unit tests
        run: gradle -p native-android --no-daemon testDebugUnitTest
      - name: Assemble native debug APK
        run: gradle -p native-android --no-daemon assembleDebug
      - name: Verify APK and checksum
        run: |
          APK=native-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee native-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PadnaKesht-Native-Compose-Alpha-not-production-approved
          path: |
            native-android/app/build/outputs/apk/debug/app-debug.apk
            native-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
